name: CI Pipeline

on:
  pull_request:
    branches: [ test ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:   
    - name: Kodu Çek       #check
      uses: actions/checkout@v3

    - name: Node.js Kurulumu
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Bağımlılıkları Yükle  ##install
      run: npm install

    - name: ESLint Kontrolü  #lint
      run: npm run lint

#test icin npm test kullanacak