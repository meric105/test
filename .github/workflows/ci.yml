name: CI Pipeline

on:
  push:
    branches: [ "main", "fire" ]
  pull_request:
    branches: [ "main", "fire" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:   
    - name: Kodu Çek
      uses: actions/checkout@v3

    - name: Node.js Kurulumu
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: ESLint/Prettier Hatalarını Otomatik Düzelt
      run: npm run lint -- --fix || true

    - name: Düzeltilen Kodları Commit Et ve Gönder
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Otomatik Prettier/ESLint düzeltmeleri uygulandı" || echo "Değişiklik bulunamadı, commit atlanıyor."
        git push

    - name: Testleri Çalıştır
      run: npm test