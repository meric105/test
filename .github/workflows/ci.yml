name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "fire" ]
  pull_request:
    branches: [ "main", "fire" ]

jobs:
  # 1. AŞAMA: Kodun test edilmesi ve lint hatalarının düzeltilmesi
  build-and-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write 

    steps:   
    - name: Kodu Çek
      uses: actions/checkout@v3

    - name: Node.js Kurulumu
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Bağımlılıkları Yükle
      run: npm install

    - name: ESLint/Prettier Hatalarını Otomatik Düzelt
      run: npm run lint -- --fix || true

    - name: Düzeltilen Kodları Commit Et ve Gönder
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add .
        git commit -m "Otomatik Prettier/ESLint düzeltmeleri uygulandı" || echo "Değişiklik bulunamadı, commit atlanıyor."
        git push

    - name: Testleri Çalıştır
      run: npm test

  # 2. AŞAMA: Testler geçerse Docker imajını oluştur ve yükle
  docker-build-push:
    needs: build-and-test # SADECE build-and-test başarıyla biterse bu aşama başlar (Job Dependency)
    if: github.ref == 'refs/heads/main' # SADECE kod main branch'ine geldiğinde çalışır (Conditional)
    runs-on: ubuntu-latest
    
    steps:
    - name: Kodu Çek
      uses: actions/checkout@v3

    - name: Docker Hub'a Giriş Yap (Secret Kullanımı)
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKETHUB_TOKEN }}

    - name: Image Build & Push İşlemi
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        # proje-adin kısmını uygulamanın adıyla değiştirmeyi unutma!
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/postmantest:latest